                            const speed = dtMove > 0 ? ad / dtMove : 0;   // px/ms

                            // 判得太严会「怎么摸都不理」：单次位移很小、要凑够换向次数。
                            // 现在只要在同一方向上累计走够 30px 就算一次划动，三下就到。
                            if (ad > 0.5 && speed > 0.03) {
                                const sign = d > 0 ? 1 : -1;
                                if (sign !== headWigSign) {
                                    headWigSign = sign;
                                    headAccum = 0;
                                }
                                headAccum += ad;
                                if (headAccum >= 30) {
                                    headAccum = 0;
                                    headStrokeAt.push(now);
                                    headStrokeAt = headStrokeAt.filter((ts) => now - ts < 2500);
                                    if (headStrokeAt.length >= 3 && now - lastPetAt > 4000) {
                                        lastPetAt = now;
                                        headStrokeAt = [];
                                        window.__petPetting = now + 1600;
                                        if (window.__petPlaySound) window.__petPlaySound('pet');
                                        if (window.__petHearts) window.__petHearts(true);
                                        if (window.Pet && window.Pet.say) {
                                            const petLine = (window.__petDshBusy && window.__petDshBusy()) ? ''
                                                : (window.__petGameMode && window.__petGameLine
                                                    ? window.__petGameLine('pet')
                                                    : window.__petPickLineFrom('pet', PET_LINES));
                                            if (petLine) window.Pet.say(petLine, 2600);
                                        }
                                    }
                                }
                            }
                        }
                    }
                    if (sx !== null) { lastScreenX = sx; lastScreenAt = performance.now(); }
                });
            }

            // ---- 主进程要求中断翻滚（挡住东西了，让开优先） ----
            // 被要求让位时也走「加速收尾」，不直接归零，免得模型啪地弹回去
            if (bridge.onAbortSpin) {
                bridge.onAbortSpin(() => {
                    lastCursorAt = performance.now();
                    spinQueue = [];
                    if (idleSpinning) {
                        idleSpinFast = true;
                    } else if (idleYawSpinning) {
                        idleYawFast = true;
                    } else if (window.petWindow && window.petWindow.setSpinning) {
                        window.petWindow.setSpinning(false);
                    }
                });
            }

            // ---- 跟随鼠标：主进程推来的速度方向 -> 侧倾；光标相对位置 -> 头朝向 ----
            if (bridge.onSwim) {
                bridge.onSwim((v) => {
                    const s = window.__petSwim;
                    if (!s || !v) return;
                    // 拖动时保留一点摆动（原来那套动作看着更有生命），
                    // 但幅度减半，免得被手带着来回抽搐
                    const dragScale = window.__petDragging ? 0.5 : 1;
                    const vx = Math.max(-1, Math.min(1, Number(v.vx) || 0));
                    const vy = Math.max(-1, Math.min(1, Number(v.vy) || 0));
                    // 头和身子都在朝光标偏了，横向侧倾就收一点，别两边打架
                    s.targetBank = -vx * 0.18 * dragScale;
                    s.targetPitch = vy * 0.06 * dragScale;
                    // 有没有在游：靠速度方向的分量判断。停在原地时主进程发的是 0/0。
                    s.targetSwim = (Math.abs(vx) + Math.abs(vy) > 0.06) ? 1 : 0;
                    s.lastAt = performance.now();

                    // 漫游（roam）消息不算"鼠标动了"：手确实没动，所以待机翻滚的
                    // 计时继续走 —— 它游着游着翻个身，挺像活的。
                    // 只记一个时间戳，具体怎么处理交给 3D 那段（变量在它作用域里，
                    // 这边直接读写会抛 ReferenceError，把后面整段朝向代码打断）
                    if (!v.roam) window.__petCursorActiveAt = performance.now();
                    const f = window.__petFace;
                    if (!f || typeof v.cx !== 'number' || typeof v.cy !== 'number') return;
                    if (window.__petTrackOff) return;   // 临时关闭：姿态固定，不追光标
                    const dx = v.cx, dy = v.cy;

                    // 开场姿势：主进程用「屏幕绝对坐标移动超过 25px」判定用户真的动了手，
                    // 再通知这边开始 0.8 秒渐变（窗口自己在动不会误触发）。
                    if (v.moved) window.__petPoseWanted = true;   // 只记意愿，什么时候切由 3D 那段决定

                    // 手离它多近：0 = 已经离开身体，1 = 压在它身上
                    const nx = dx / (innerWidth * 0.357);
                    const ny = dy / (innerHeight * 0.3125);
                    const r = Math.hypot(nx, ny);
                    // 只要离开身体一点点（r > 0.95，约 142px）就算 0 —— 也就是「完全
                    // 面向箭头」；只有真压到它身上，才慢慢收成正对镜头。
                    f.nearTarget = Math.max(0, Math.min(1, (0.95 - r) / 0.3));
                    const far = 1 - f.nearTarget;

                    const len = Math.hypot(dx, dy);
                    const ux = len > 1 ? dx / len : 0;
                    const uy = len > 1 ? dy / len : 0;

                    // 头指向箭头：屏幕角度 α（右=0，上=π/2，下=-π/2，左=π）。
                    //
                    // 头在局部 -X。用镜像（flip=-1）时头的基准角变成 0，不用镜像时是 π。
                    // 于是按 α 落在哪半边选镜像，平面旋转 φ 就永远落在 ±90° 内 ——
                    // 这就是「超过 90° 自动镜像、不会倒着游」：α 跨过 ±90° 的那一瞬
                    // 换一次镜像，φ 从 +90 翻到 -90（差 π），同时把当前倾角也补上 π，
                    // 头指的方向是连续的，只有身体镜像了一下。
                    // 方向先平滑再看角度：鼠标猛甩时 ux/uy 会一帧内翻个方向，直接拿去
                    // 算角度会让镜像疯狂切换、整只抽搐。这里对「角度」做 120ms 低通，
                    // 并按最短路走（跨 ±180° 不会绕远路）。
                    const nowSwim = performance.now();
                    const dtSwim = Math.min((nowSwim - (f.lastAt || nowSwim)) / 1000, 0.25);
                    f.lastAt = nowSwim;
                    let rawAng = Math.atan2(-uy, ux);
                    // 光标几乎压在它中心（<40px）时，方向向量是噪声：上下蹭两下手就
                    // 从"朝下"翻到"朝上"，角度能一口气转 180°。这时候干脆别更新方向，
                    // 保持上一次的朝向 —— 不然它会跟着手的抖动原地打圈。
                    const nearCenter = len < 40;
                    if (!f.smoothInit) { f.angSmooth = rawAng; f.smoothInit = true; }
                    else if (!nearCenter) {
                        let dAng = rawAng - f.angSmooth;
                        while (dAng > Math.PI) dAng -= Math.PI * 2;
                        while (dAng < -Math.PI) dAng += Math.PI * 2;
                        const k = 1 - Math.pow(0.0001, dtSwim / 0.16);
                        f.angSmooth += dAng * k;
                    }
                    // 只把平滑角度归一化到 [-π, π]，绝不动 f.tilt：以前在这里顺手挪
                    // 倾角，far 很小时（手压在它身上）两边挪的量不一样，差出 2π 级别，
                    // 缓动就会带着它转一整圈。
                    let ang = f.angSmooth;
                    while (ang > Math.PI) ang -= Math.PI * 2;
                    while (ang < -Math.PI) ang += Math.PI * 2;
                    f.angSmooth = ang;

                    // 启动后先固定朝左一小会儿，别一上来就被光标拽着转
                    if (performance.now() < (f.lockUntil || 0)) {
                        f.tiltTarget = 0;
                        f.yawTarget = 0;
                        f.pitchTarget = 0;
                        return;
                    }

                    const half = Math.PI / 2;
                    // ±11° 滞回 + 450ms 冷却：贴着中线晃动、或者手速太快时，不会连续翻面
                    let wantFlip = f.flip;
                    if (f.nearTarget < 0.5 && nowSwim - (f.lastFlipAt || 0) > 450) {
                        if (f.flip === -1) wantFlip = Math.abs(ang) > half + 0.20 ? 1 : -1;
                        else wantFlip = Math.abs(ang) < half - 0.20 ? -1 : 1;
                    }
                    const phi = wantFlip === -1 ? ang : (ang > 0 ? ang - Math.PI : ang + Math.PI);
                    // 目标角折回「离当前倾角最近的那个等价角」（差 2π 的整数倍）。
                    // 这样无论角度怎么归一化，缓动永远走最短路，不会为了追一个
                    // 等价角而绕整圈。
                    let tTarget = phi * far;
                    tTarget -= Math.round((tTarget - f.tilt) / (Math.PI * 2)) * Math.PI * 2;
                    if (wantFlip !== f.flip) {
                        // 不再瞬间对齐：镜像本身有过渡动画（flipShown 从 1 平滑到 -1，
                        // 由 animate 负责），倾角也交给缓动追过去，两者一起把"翻面"
                        // 演成一个动作，而不是"啪"地一下。
                        // 真正的 180° 转身：目标角 = -1 侧对应 π，+1 侧对应 0
                        f.turnFrom = f.baseShown;
                        f.turnTo = wantFlip === -1 ? Math.PI : 0;
                        if (Math.abs(f.turnTo - f.turnFrom) > 0.01) f.turnT = 1e-4;
                        else f.baseShown = f.turnTo;
                        f.flip = wantFlip;
                        f.lastFlipAt = nowSwim;
                    }
                    f.tiltTarget = tTarget;
                    f.yawTarget = 0;
                    f.pitchTarget = uy * 0.10 * far;

                });
            }
            bridge.onReply((data) => {
                if (data.error) {
                    window.Pet.say('出错：' + data.error, 6000);
                }
            });
            // ---- 余额查询结果播报 ----
            if (bridge.onBalance) {
                bridge.onBalance((data) => {
                    if (!data) return;
                    if (data.kind === 'loading') {
                        window.Pet.say('💰 查余额中…', 0);
                    } else if (data.kind === 'ok') {
                        window.Pet.say(data.text, 8000);
                        if (window.__petHappy) window.__petHappy();
                        playSound(data.data && data.data.available ? 'heart' : 'sleep');
                    } else {
                        window.Pet.say(data.text || '余额查询失败', 6000);
                        playSound('sleep');
                    }
                });
            }
            // DSH 正在跑任务（深度求索 / 干活）：互动只给动作和音效，不说话的台词
            window.__petDshBusy = function () {
                try { return !!(window.__petThinking && window.__petThinking()); } catch (e) { return false; }
            };
            // ---- 单击互动：说话 + 弹出派活输入框 ----
            let input = null;
            let streamBuf = ''; // 派活后的流式回复缓冲（P3）
            let streamTurn = null, streamStep = null; // 跨 step 边界重置缓冲用
            function openInput() {
                if (input) return;
                input = document.createElement('input');
                input.className = 'pet-input';
                input.placeholder = '派个活给我：例如「帮我看看今天的日期」';
                document.body.appendChild(input);
                input.focus();
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && input.value.trim()) {
                        const text = input.value.trim();
                        input.value = '';
                        // 发完不再收起：这个框是常驻的，可以接着派下一个活
                        window.Pet.say('收到，我去看看~', 2000);
                        streamBuf = '';
                        streamTurn = null; streamStep = null;
                        bridge.prompt(text);
                    } else if (e.key === 'Escape') {
                        closeInput();
                    }
                });
                function outside() { /* 以前点别处就收起，现在改成常驻，只有 Esc 才关 */ }
                function closeInput() {
                    if (!input) return;
                    document.removeEventListener('mousedown', outside);
                    input.remove();
                    input = null;
                }
                window.__petCloseInput = closeInput;
                // 在框里打字 => 别让面板 8 秒后把框收走
                input.addEventListener('input', function () {
                    if (window.__petKeepPanel) window.__petKeepPanel();
                });
            }
            window.Pet.on('click', () => {
                openInput();
                if (input) { try { input.focus(); } catch (e) { /* 忽略 */ } }
                if (window.__petKeepPanel) window.__petKeepPanel();
            });
            // ---- 派活后的结果回显：订阅 assistant 流式文本（P3） ----
            if (bridge.onStream) {
                bridge.onStream((data) => {
                    if (data.kind === 'chunk') {
                        // 新的一步（turn/step 变化）时重置缓冲，避免跨 step 拼接
                        if (data.turn !== streamTurn || data.step !== streamStep) {
                            streamBuf = '';
                            streamTurn = data.turn; streamStep = data.step;
                        }
                        streamBuf += data.text || '';
                        window.Pet.say(streamBuf, 0);
                    } else if (data.kind === 'message') {
                        streamBuf = data.text || '';
                        streamTurn = null; streamStep = null;
                        if (streamBuf) window.Pet.say(streamBuf, 0);
                    } else if (data.kind === 'done') {
                        if (streamBuf) window.Pet.say(streamBuf, 8000);
                        streamBuf = '';
                        streamTurn = null; streamStep = null;
                    }
                });
            }
            // ---- 主进程让说话（比如「新版链接已复制」）----
            if (window.petWindow && window.petWindow.onSay) {
                window.petWindow.onSay(function (v) {
                    if (!v || !v.text) return;
                    // show 定义在另一个闭包里，这里必须走 window 上的引用
                    if (typeof window.__petShow === 'function') window.__petShow(v.text, v.ms || 4000);
                });
            }

            // ---- 游戏模式：换一套台词 ----
            // 注意：这个是挂在 petWindow 上的（不是 petBridge），别接错了
            if (window.petWindow && window.petWindow.onGameMode) {
                window.petWindow.onGameMode((on) => { window.__petGameMode = !!on; });
            }

            // ---- 小游戏：吃到鱼 ----
            // ⚠️ 这个挂在 petWindow 上（不是 petBridge）。两个对象名字很像，
            // 接错了不会报错、只是回调永远不触发 —— 吃鱼没反应就是这么来的。
            if (window.petWindow && window.petWindow.onFishEaten) {
                window.petWindow.onFishEaten(function (data) {
                    if (window.__petEatFish) window.__petEatFish(data && data.x, data && data.y);
                });
            }

            // ---- 体型大小 ----
            if (bridge.onSetSize) {
                bridge.onSetSize((k) => { if (window.__petSetScale) window.__petSetScale(k); });
            }

            // ---- 换皮肤 / 自定义配色 / 跳舞强度 ----
            if (bridge.onSetSkin) {
                bridge.onSetSkin((name) => { if (window.__petSetSkin) window.__petSetSkin(name); });
            }
            if (bridge.onSetCustomSkin) {
                bridge.onSetCustomSkin((v) => { if (v && window.__petSetCustomSkin) window.__petSetCustomSkin(v.dark, v.white); });
            }
            if (bridge.onSetDanceFreq) {
                bridge.onSetDanceFreq((v) => { if (window.__petSetDanceFreq) window.__petSetDanceFreq(v); });
            }
            // ---- 播放器频谱 → 温和摆动 + 节拍检测（打拍子/转圈/音符） ----
            if (bridge.onAudioFreq) {
                // 主窗口只负责两件事：把响度换算成跳舞幅度；以及在长期没有拍的时候补拍。
                // 节拍本身由播放器判定（它手里有实时频谱），通过 pet:beat 推过来。
                let lastBeatAt = 0;
                let audioEnergy = 0;
                bridge.onAudioFreq((data) => {
                  try {
                    const arr = Array.isArray(data) ? data : [];
                    window.__audioFrames = (window.__audioFrames || 0) + 1;
                    if (!arr.length) return;
                    // 末尾两位是播放器打的标记：拍点、拍间隔
                    const n = arr.length >= 66 ? arr.length - 2 : arr.length;
                    let sum = 0;
                    for (let i = 0; i < n; i++) sum += arr[i];
                    const lvl = Math.min(1, (sum / n) / 110);
                    audioEnergy = lvl;
                    if (window.__petSetDance) window.__petSetDance(lvl);
                    if (arr.length >= 67) {
                        // 播放器发的是 64 个频点 + 3 个附加位：拍标记 / 拍间隔 / 重音时刻
                        const isBeat = arr[arr.length - 3];
                        const gapMs = arr[arr.length - 2];
                        if (gapMs > 250 && gapMs < 2000) window.__beatGapMs = Math.min(2000, Math.max(280, window.__beatGapMs * 0.7 + gapMs * 0.3));
                        if (isBeat > 0) {
                            lastBeatAt = Date.now();
                            // 播放器把「重音真正发生」的时刻也带了过来
                            const bt = arr[arr.length - 1];
                            let late = 0;
                            if (bt > 1000000000) {
                                late = Date.now() - bt;
                                if (!(late > 0 && late < 300)) late = 0;
                            }
                            window.__beatLate = late;
                            if (window.__petOnBeat) window.__petOnBeat(late);
                        }
                    }

                  } catch (e) { window.__audioErr = String(e && e.message) + ' @' + (e && e.stack ? e.stack.split('\n')[1] : ''); }
                });

                if (bridge.onBeat) {
                    bridge.onBeat((gapMs) => {
                        const g = Number(gapMs);
                        if (isFinite(g) && g > 0) window.__beatGapMs = Math.min(2000, Math.max(280, window.__beatGapMs * 0.7 + g * 0.3));
                        lastBeatAt = Date.now();
                        if (window.__petOnBeat) window.__petOnBeat();
                    });
                }

                // 漏检补拍：某些段落很平（长音、清唱），按当前这首歌的速度接着点
                setInterval(() => {
                    if ((window.__petDanceFreq || 0) <= 0) return;
                    if (audioEnergy < 0.02) return;
                    const now = Date.now();
                    if (now - lastBeatAt > Math.max(280, window.__beatGapMs) * 1.05) {
                        lastBeatAt = now;
                        if (window.__petOnBeat) window.__petOnBeat();
                    }
                }, 40);
            }
                        if (bridge.onMusicComment) {
                bridge.onMusicComment((name) => { if (name) window.Pet.say('正在播放：' + name, 3000); });
            }
        })();
    </script>
</body>
</html>
